project:
  type: website
  resources:
    - CNAME
    - viewer-app/**
  render:
    - "*.qmd"
    - "!watersystems/template.qmd"
website:
  title: "Ribasim-NL"
  favicon: assets/favicon.ico
  page-navigation: true
  navbar:
    logo: assets/logo.png
    left:
      - text: "Model derivation"
        file: workflow/index.qmd
      - text: "Water systems"
        file: watersystems/main.qmd
      - text: "Model viewer"
        file: viewer.qmd
    right:
      - text: "Contributing"
        file: dev/index.qmd
      - text: "API reference"
        file: reference/index.qmd
      - icon: github
        href: https://github.com/Deltares/Ribasim-NL
        aria-label: GitHub
  sidebar:
    - title: "Model derivation"
      contents:
        - workflow/index.qmd
        - workflow/main-watersystem.qmd
        - section: "Gravity controlled models"
          contents:
            - workflow/gravity-controlled.qmd
            - workflow/lumping.qmd
        - section: "Level controlled models"
          contents:
            - workflow/level-controlled.qmd
            - workflow/profile-generation.qmd
            - workflow/split-basins.qmd
        - section: "Shared steps"
          contents:
            - workflow/control.qmd
            - workflow/storage-basins.qmd
            - workflow/design-capacities.qmd
            - workflow/forcing.qmd
            - workflow/seasonal-levels.qmd
            - workflow/layout.qmd
        - section: "The nationwide model"
          contents:
            - workflow/couple.qmd
    - title: "Contributing"
      contents:
        - dev/index.qmd
        - dev/testing.qmd
        - dev/type-checking.qmd
        - section: "Running the pipeline"
          contents:
            - dev/dvc.qmd
            - dev/local.qmd
            - dev/slurm.qmd
            - dev/pull-requests.qmd
            - dev/reproducing-models.qmd
        - section: "Tools"
          contents:
            - dev/viewer.qmd
            - dev/ribasim.qmd
            - dev/docs.qmd
            - cloudstorage.qmd
    - title: "Water systems"
      contents:
        - watersystems/main.qmd
        - watersystems/AaenMaas.qmd
        - watersystems/BrabantseDelta.qmd
        - watersystems/DeDommel.qmd
        - watersystems/DrentsOverijsselseDelta.qmd
        - watersystems/HunzeenAas.qmd
        - watersystems/Limburg.qmd
        - watersystems/Noorderzijlvest.qmd
        - watersystems/RijnenIJssel.qmd
        - watersystems/StichtseRijnlanden.qmd
        - watersystems/ValleienVeluwe.qmd
        - watersystems/Vechtstromen.qmd
format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    mermaid:
      theme: neutral
lightbox:
  match: auto
  effect: zoom
  desc-position: bottom
  css-class: "fullscreen-lightbox"
quartodoc:
  style: pkgdown
  dir: reference
  title: API reference
  parser: sphinx
  package: ribasim_nl
  sections:
    - title: Model
      desc: The model class, and building a model from parts.
      contents:
        - Model
        - Network
        - NetworkValidator
        - concat
        - prefix_index
        - reset_index
        - CloudStorage
    - title: Regional models
      desc: Steps shared by the regional models.
      contents:
        - regional_model
        - design_capacities
        - capacity
        - seasonal_levels
        - peilbeheer
        - supply
        - transboundary_inflow
        - observations
        - split_basins
    - title: Geometry and layout
      desc: The layout of a model on the map, which does not change its results.
      contents:
        - layout
        - network_snapping
        - flow_paths
        - geometry
        - junctionify
    - title: Validation and results
      desc: Checks on the model input and on the results of a run.
      contents:
        - validation
        - result_validation
        - goodness_of_fit
        - steady_state_regression
        - write_performance
    - title: Model viewer
      desc: Exporting and publishing a model for the model viewer.
      contents:
        - webmap
        - webmap_diff
        - webmap_publish
