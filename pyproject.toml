[tool.pytest]
strict = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "NPY",
    "PD",
    "PERF",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "UP",
]
ignore = [
    "D1",
    "D400",
    "D401",
    "E501",  # TODO https://docs.astral.sh/ruff/rules/line-too-long/
    "F403",  # TODO https://docs.astral.sh/ruff/rules/undefined-local-with-import-star/
    "F405",  # TODO https://docs.astral.sh/ruff/rules/undefined-local-with-import-star-usage/
    "PD002",
    "PD003",
    "PD008",
    "PD009",
    "PD010",
    "PD011",
    "PD013",
    "PD015",
    "S101",  # assert used pervasively for data validation in this modeling project
    "S603",  # subprocess calls to known commands (uv, ribasim, dvc)
    "S607",  # partial executable paths for known commands
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.src]
include = [
    "notebooks/06_add_synthetic_forcing.py",
    "pipeline",
    "scripts/clean.py",
    "scripts/install_repro_main.py",
    "scripts/repro.py",
    "scripts/repro_main.py",
    "src/hydamo/hydamo",
    "src/peilbeheerst_model/peilbeheerst_model",
    "src/ribasim_nl/ribasim_nl",
]

[tool.ty.environment]
python-version = "3.13"
root = [
    "scripts",
    "src/hydamo",
    "src/peilbeheerst_model",
    "src/ribasim_nl",
]

[tool.ty.analysis]
replace-imports-with-any = ["tqdm", "tqdm.*", "openpyxl", "openpyxl.*"]

# Keep type checking enabled by default. These overrides ignore only the named
# diagnostic for the listed files, which are pre-pipeline peilbeheerst and hydamo code.
[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/assign_flushing.py",
]

[tool.ty.overrides.rules]
call-non-callable = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/assign_flushing.py",
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
    "src/peilbeheerst_model/peilbeheerst_model/postprocess_data/post-processing_HHNK.py",
    "src/peilbeheerst_model/peilbeheerst_model/shortest_path.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/crossings_to_ribasim.py",
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/assign_flushing.py",
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"

[[tool.ty.overrides]]
include = [
    "src/hydamo/hydamo/datamodel.py",
    "src/peilbeheerst_model/peilbeheerst_model/crossings_to_ribasim.py",
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
]

[tool.ty.overrides.rules]
no-matching-overload = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/crossings_to_ribasim.py",
]

[tool.ty.overrides.rules]
not-iterable = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/assign_flushing.py",
    "src/peilbeheerst_model/peilbeheerst_model/crossings_to_ribasim.py",
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
]

[tool.ty.overrides.rules]
not-subscriptable = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/shortest_path.py",
]

[tool.ty.overrides.rules]
possibly-missing-submodule = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/assign_flushing.py",
    "src/peilbeheerst_model/peilbeheerst_model/crossings_to_ribasim.py",
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
    "src/peilbeheerst_model/peilbeheerst_model/preprocess_data/Rivierenland.py",
    "src/peilbeheerst_model/peilbeheerst_model/shortest_path.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = [
    "src/peilbeheerst_model/peilbeheerst_model/parse_crossings.py",
]

[tool.ty.overrides.rules]
unsupported-operator = "ignore"
